env {
  job.mode="STREAMING"
  parallelism=2
  checkpoint.interval=2000
  spark.checkpoint.location="/tmp/seatunnel_mnt/spark-schema-recovery"
}
source { MySQL-CDC {
  plugin_output="records"
  url="jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
  username="mysqluser"
  password="mysqlpw"
  table-names=["mysql_cdc.spark_restore_a","mysql_cdc.spark_restore_b"]
  incremental.parallelism=2
  server-id="19400-19419"
  schema-changes.enabled=false
} }
sink { Jdbc {
  plugin_input="records"
  url="jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
  driver="com.mysql.cj.jdbc.Driver"
  user="mysqluser"
  password="mysqlpw"
  database="mysql_cdc"
  table="${table_name}_sink"
  primary_keys=["id"]
  generate_sink_sql=true
  schema_save_mode="CREATE_SCHEMA_WHEN_NOT_EXIST"
  data_save_mode="APPEND_DATA"
  batch_size=10000
} }
