env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
  execution.restart.strategy = "fixed-delay"
  execution.restart.attempts = 10
  execution.restart.delayBetweenAttempts = 5000
}

source {
  MySQL-CDC {
    server-id = 5628-5633
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.collector_products", "shop.collector_other"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    schema-changes.enabled = "${restore_schema_enabled}"
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "mysqluser"
    password = "mysqlpw"
    generate_sink_sql = true
    database = "shop"
    table = "collector_sink_${table_name}"
    primary_keys = ["id"]
    batch_size = 1
    is_exactly_once = "${restore_exactly_once}"
    xa_data_source_class_name = "com.mysql.cj.jdbc.MysqlXADataSource"
  }
}
