name: Prepare Maven wrapper
description: Cache only the pinned, SHA-256-verified Maven wrapper JAR
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      id: wrapper-cache
      with:
        path: .mvn/wrapper/maven-wrapper.jar
        key: wrapper-jar-v1-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties', '.github/actions/prepare-maven-wrapper/prepare.sh') }}
    - name: Verify or download the wrapper JAR
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"
    - uses: actions/cache/save@v4
      if: steps.wrapper-cache.outputs.cache-hit != 'true'
      with:
        path: .mvn/wrapper/maven-wrapper.jar
        key: ${{ steps.wrapper-cache.outputs.cache-primary-key }}
