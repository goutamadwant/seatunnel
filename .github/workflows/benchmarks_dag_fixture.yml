name: Finished DAG Fixture Confirmation
run-name: Finished DAG fixture Java ${{ inputs.java_version }}
on:
  workflow_dispatch:
    inputs:
      java_version:
        description: Native JDK for both frozen revisions
        required: true
        type: choice
        options: ['11', '8']
        default: '11'
permissions:
  contents: read
concurrency:
  group: dag-fixture-java${{ inputs.java_version }}
  cancel-in-progress: false
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASELINE_SHA: af5c3f3101e0bf0b83108ec7420c84c29ccaa936
      CANDIDATE_SHA: 2dcb0f28ac18021cadf7e1d97912a0b269d2419b
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - name: Verify immutable revisions and collector tests
        shell: bash
        run: |
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^)" = "$BASELINE_SHA"
          python3 -m unittest discover -s harness/tools/benchmarks -p 'test_dag_fixture_confirmation.py' -v
      - name: Build both artifacts before timing
        shell: bash
        run: |
          mkdir -p evidence
          for role in baseline candidate; do
            (cd "$role" && ./mvnw -B -Pbenchmark -pl seatunnel-benchmarks -am -DskipTests -Dskip.ui=true install) 2>&1 | tee "evidence/build-$role.log"
          done
          (cd candidate && ./mvnw -B -Pbenchmark -pl seatunnel-benchmarks -Dskip.ui=true verify) 2>&1 | tee evidence/benchmark-tests.log
      - name: Run serial original-settings comparisons
        env:
          JAVA_VERSION: ${{ inputs.java_version }}
        shell: bash
        run: |
          python3 harness/tools/benchmarks/dag_fixture_confirmation.py \
            --baseline baseline/seatunnel-benchmarks/target/benchmarks.jar \
            --candidate candidate/seatunnel-benchmarks/target/benchmarks.jar \
            --java-version "$JAVA_VERSION" --output evidence/scored 2>&1 | tee evidence/collector.log
      - name: Preserve all evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dag-fixture-java${{ inputs.java_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
