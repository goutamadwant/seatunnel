name: CI fixture validation

on:
  push:
    branches: ['test/ci-fixtures-validation']

permissions:
  contents: read

concurrency:
  group: ci-fixture-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cold-cache:
    name: Cold wrapper cache (${{ matrix.os }})
    if: github.repository == 'goutamadwant/seatunnel'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the validation cache from other runs
        shell: bash
        run: printf '\n# Validation cache namespace %s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> .mvn/wrapper/maven-wrapper.properties
      - name: Look up the fresh cache key without restoring
        id: lookup
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: .mvn/wrapper/maven-wrapper.jar
          key: wrapper-jar-v1-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties', '.github/actions/prepare-maven-wrapper/prepare.sh') }}
      - name: Require a genuine cold cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != true
          test ! -e .mvn/wrapper/maven-wrapper.jar
      - name: Run bootstrap regression tests
        shell: bash
        run: bash .github/actions/prepare-maven-wrapper/test.sh
      - uses: ./.github/actions/prepare-maven-wrapper
      - name: Verify the cache was saved before any Maven build
        id: saved
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: .mvn/wrapper/maven-wrapper.jar
          key: wrapper-jar-v1-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties', '.github/actions/prepare-maven-wrapper/prepare.sh') }}
      - name: Require the saved cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.saved.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true

  warm-cache:
    name: Warm wrapper cache (${{ matrix.os }})
    needs: cold-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Select the same cache key on this fresh runner
        shell: bash
        run: printf '\n# Validation cache namespace %s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> .mvn/wrapper/maven-wrapper.properties
      - name: Look up the cache saved by the previous job
        id: lookup
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: .mvn/wrapper/maven-wrapper.jar
          key: wrapper-jar-v1-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties', '.github/actions/prepare-maven-wrapper/prepare.sh') }}
      - name: Require cross-job cache availability
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test ! -e .mvn/wrapper/maven-wrapper.jar
      - name: Disable wrapper downloads before the actual cache restore
        shell: bash
        run: |
          mkdir .wrapper-download-guard
          printf '#!/usr/bin/env bash\nprintf used > "$(dirname "$0")/download-used"\nexit 97\n' > .wrapper-download-guard/curl
          chmod +x .wrapper-download-guard/curl
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/.wrapper-download-guard" >> "$GITHUB_PATH"
          else
            printf '%s\n' "$PWD/.wrapper-download-guard" >> "$GITHUB_PATH"
          fi
      - uses: ./.github/actions/prepare-maven-wrapper
      - name: Require a restored JAR without any download attempt
        if: always()
        shell: bash
        run: |
          trap 'rm -rf .wrapper-download-guard' EXIT
          test ! -e .wrapper-download-guard/download-used
          test -s .mvn/wrapper/maven-wrapper.jar
      - name: Verify the Linux launcher
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw --version
      - name: Verify the native Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\mvnw.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  paypal-windows:
    name: PayPal native Windows Java ${{ matrix.java }}
    needs: warm-cache
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11']
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx768m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: ./.github/actions/prepare-maven-wrapper
      - name: Build only PayPal and its reactor dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation-results | Out-Null
          git rev-parse HEAD
          java -version
          & .\mvnw.cmd -B -ntp -T 1 -Pci -pl :connector-http-paypal -am -DskipTests=true -DskipUT=true -DskipIT=true -Dlicense.skipAddThirdParty=true install 2>&1 | Tee-Object validation-results/dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the full PayPal module
        shell: pwsh
        run: |
          & .\mvnw.cmd -B -ntp -T 1 -Pci -pl :connector-http-paypal -DskipTests=false -DskipUT=false -DskipIT=false -DfailIfNoTests=true '-Dsurefire.jvm.args=-Xmx512m -Dfile.encoding=UTF-8' clean verify 2>&1 | Tee-Object validation-results/module.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item seatunnel-connectors-v2/connector-http/connector-http-paypal/target/surefire-reports validation-results/unit-reports -Recurse
          Copy-Item seatunnel-connectors-v2/connector-http/connector-http-paypal/target/failsafe-reports validation-results/packaging-reports -Recurse
          foreach ($case in @(@{Name='unit-reports'; Expected=59}, @{Name='packaging-reports'; Expected=1})) {
            $total = 0
            foreach ($file in Get-ChildItem "validation-results/$($case.Name)/TEST-*.xml") {
              [xml]$report = Get-Content $file.FullName -Raw
              $suite = $report.testsuite
              $total += [int]$suite.tests
              if ([int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) { throw "Non-green test report: $($file.Name)" }
            }
            if ($total -ne $case.Expected) { throw "Expected $($case.Expected) tests, found $total in $($case.Name)" }
          }
      - name: Repeat retry-close verification on native Windows
        shell: pwsh
        run: |
          $reports = 'seatunnel-connectors-v2/connector-http/connector-http-paypal/target/surefire-reports'
          for ($i = 1; $i -le 10; $i++) {
            Remove-Item $reports -Recurse -Force
            & .\mvnw.cmd -B -ntp -T 1 -Pci -pl :connector-http-paypal -DskipTests=false -DskipUT=false -DfailIfNoTests=true '-Dtest=PayPalClientTest#closeWakesRetryWait' '-Dsurefire.jvm.args=-Xmx512m -Dfile.encoding=UTF-8' surefire:test 2>&1 | Tee-Object "validation-results/retry-close-$i.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files = @(Get-ChildItem "$reports/TEST-*.xml")
            if ($files.Count -ne 1) { throw 'Expected exactly one retry-close test report' }
            [xml]$report = Get-Content $files[0].FullName -Raw
            $suite = $report.testsuite
            if ([int]$suite.tests -ne 1 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) { throw "Retry-close iteration $i did not pass exactly one test" }
            Copy-Item $reports "validation-results/retry-close-$i-reports" -Recurse
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paypal-windows-java${{ matrix.java }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            validation-results/
            seatunnel-connectors-v2/connector-http/connector-http-paypal/target/surefire-reports/
            seatunnel-connectors-v2/connector-http/connector-http-paypal/target/failsafe-reports/
