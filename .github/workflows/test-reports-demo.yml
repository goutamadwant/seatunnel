# Demo of the upload-test-reports action on a failing build.
name: Test reports demo
on:
  push:
    branches: [ 'test/ci-report-upload-demo' ]
jobs:
  demo:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '8' ]
        os: [ 'ubuntu-latest', 'windows-latest' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Build a module with one failing unit test and one failing IT
        shell: bash
        run: |
          mkdir -p demo-mod/src/test/java/demo
          cat > demo-mod/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>demo</groupId><artifactId>demo-mod</artifactId><version>1</version>
            <properties><maven.compiler.source>8</maven.compiler.source><maven.compiler.target>8</maven.compiler.target></properties>
            <dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter-engine</artifactId><version>5.9.0</version><scope>test</scope></dependency></dependencies>
            <build><plugins>
              <plugin><artifactId>maven-surefire-plugin</artifactId><version>2.22.2</version><configuration><testFailureIgnore>true</testFailureIgnore></configuration></plugin>
              <plugin><artifactId>maven-failsafe-plugin</artifactId><version>2.22.2</version><executions><execution><goals><goal>integration-test</goal><goal>verify</goal></goals></execution></executions></plugin>
            </plugins></build>
          </project>
          POM
          printf 'package demo;\nimport org.junit.jupiter.api.*;\npublic class DemoTest { @Test void passes() {} @Test void failsAssertion() { Assertions.assertEquals(1, 2, "rows | mismatch"); } }\n' > demo-mod/src/test/java/demo/DemoTest.java
          printf 'package demo;\nimport org.junit.jupiter.api.*;\npublic class DemoIT { @Test void throwsError() { throw new IllegalStateException("container did not start"); } }\n' > demo-mod/src/test/java/demo/DemoIT.java
          mvn -B -f demo-mod/pom.xml verify
      - name: Upload test reports
        if: failure()
        uses: ./.github/actions/upload-test-reports
        with:
          id: ${{ matrix.java }}-${{ matrix.os }}
